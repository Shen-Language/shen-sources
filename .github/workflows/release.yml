name: Release

on:
  push:
    tags:
      - "shen-*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build KLambda and release archives
        run: |
          make fetch
          make klambda
          make release

      - name: Verify release archive contents
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#shen-}"
          ROOT="ShenOSKernel-${VERSION}"
          ZIP_ASSET="release/${ROOT}.zip"
          TAR_ASSET="release/${ROOT}.tar.gz"
          EXPECTED_PATHS=(
            VERSION
            Makefile
            make.shen
            make-stlib.shen
            benchmarks/benchmarks.shen
            benchmarks/control-flow.shen
            benchmarks/data.shen
            benchmarks/equality-check.shen
            benchmarks/pattern-matching.shen
            benchmarks/shen-compilation.shen
            klambda/init.kl
            klambda/stlib.kl
            tests/runme.shen
          )

          for PATH_IN_RELEASE in "${EXPECTED_PATHS[@]}"; do
            tar -tzf "$TAR_ASSET" "$ROOT/$PATH_IN_RELEASE" >/dev/null
            unzip -Z1 "$ZIP_ASSET" "$ROOT/$PATH_IN_RELEASE" >/dev/null
          done

          test "$(tar -xOzf "$TAR_ASSET" "$ROOT/VERSION")" = "$VERSION"
          test "$(unzip -p "$ZIP_ASSET" "$ROOT/VERSION")" = "$VERSION"

      - name: Extract release notes from CHANGELOG
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#shen-}"
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { in_section = 1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md

          if ! grep -q '[^[:space:]]' release-notes.md; then
            {
              printf 'Release %s\n' "$VERSION"
              printf '\n'
              printf 'See CHANGELOG.md for details.\n'
            } > release-notes.md
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#shen-}"
          ZIP_ASSET="release/ShenOSKernel-${VERSION}.zip"
          TAR_ASSET="release/ShenOSKernel-${VERSION}.tar.gz"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --draft=true \
              --title "Shen OS Kernel ${VERSION}" \
              --notes-file release-notes.md
          else
            gh release create "$TAG_NAME" \
              --draft \
              --verify-tag \
              --title "Shen OS Kernel ${VERSION}" \
              --notes-file release-notes.md
          fi

          gh release upload "$TAG_NAME" \
            "$ZIP_ASSET" \
            "$TAR_ASSET" \
            --clobber
